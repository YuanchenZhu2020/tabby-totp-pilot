name: Publish

# 推送 v* 标签触发：校验版本一致 → 测试 → 构建 → 发布 npm → 创建 GitHub Release 并上传 .tgz
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # need for oicd
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag ($GITHUB_REF_NAME) 与 package.json 版本 ($PKG_VERSION) 不一致，拒绝发布" >&2
            exit 1
          fi

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 打包 tgz
        run: npm pack

      - name: 发布到 npm（Trusted Publishing / OIDC）
        run: npm publish --provenance

      - name: 创建 GitHub Release 并上传 tgz
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tabby-totp-pilot-*.tgz
